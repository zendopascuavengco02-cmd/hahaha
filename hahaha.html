<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f1e9">
  <title>A surprise letter for you</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffaf2;
      --ink: #252d26;
      --muted: #68736a;
      --berry: #b83b58;
      --berry-dark: #842b43;
      --leaf: #58755c;
      --sun: #e9b94e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 32px 20px;
      color: var(--ink);
      background-color: #f8f1e9;
      background-image: radial-gradient(#d8c8b5 0.75px, transparent 0.75px);
      background-size: 18px 18px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .gift {
      width: min(100%, 610px);
      position: relative;
      padding: clamp(30px, 7vw, 62px);
      border: 1px solid #e4d8c8;
      background: var(--paper);
      box-shadow: 0 22px 70px #5545321c;
      text-align: center;
      animation: arrive 700ms ease-out both;
    }

    .gift::before, .gift::after {
      content: "✳";
      position: absolute;
      color: var(--leaf);
      font-size: 22px;
    }
    .gift::before { top: 18px; left: 20px; }
    .gift::after { right: 20px; bottom: 18px; color: var(--berry); }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--leaf);
      font: 700 11px/1.4 Arial, sans-serif;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 480px;
      margin: 0 auto;
      font-size: clamp(40px, 10vw, 68px);
      font-weight: 400;
      line-height: 0.98;
    }

    h1 span { color: var(--berry); font-style: italic; }

    .envelope {
      display: block;
      width: min(100%, 220px);
      height: 150px;
      margin: 30px auto 25px;
      overflow: visible;
      animation: bob 2.8s ease-in-out infinite;
    }
    .envelope-back { fill: #f1d8bd; }
    .envelope-paper { fill: #fffdf8; }
    .envelope-front { fill: #e88769; }
    .envelope-flap { fill: #d65d72; }
    .envelope-seal { fill: #fffaf2; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .intro {
      max-width: 370px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    button {
      min-height: 48px;
      padding: 0 23px;
      border: 0;
      border-radius: 2px;
      color: #fffaf2;
      background: var(--berry);
      font: 700 13px Arial, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }
    button:hover { background: var(--berry-dark); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .letter {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 650ms ease, opacity 400ms ease, margin 400ms ease;
    }
    .letter.open {
      max-height: 500px;
      margin-top: 30px;
      opacity: 1;
    }
    .letter-copy {
      padding-top: 23px;
      border-top: 1px solid #e8ddcf;
      text-align: left;
      font-size: 17px;
      line-height: 1.8;
    }
    .letter-copy p { margin: 0 0 14px; }

    .surprise {
      margin: 18px 0 22px !important;
      color: var(--berry);
      font: 900 clamp(30px, 8vw, 52px)/1.05 Arial, sans-serif;
      letter-spacing: 1px;
      text-align: center;
      overflow-wrap: anywhere;
      animation: arrive 500ms ease-out both;
    }

    .signoff { color: var(--berry-dark); font-style: italic; }

    .footer {
      margin: 30px 0 0;
      color: #8b9187;
      font: 11px Arial, sans-serif;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="gift">
    <p class="eyebrow">A little surprise, just for you</p>
    <h1>You've got <span>mail!</span></h1>

    <svg class="envelope" viewBox="0 0 220 150" role="img" aria-label="A sealed pink envelope">
      <rect class="envelope-paper" x="35" y="18" width="150" height="112" rx="5" />
      <path class="envelope-back" d="M35 40 110 94l75-54v78a12 12 0 0 1-12 12H47a12 12 0 0 1-12-12Z" />
      <path class="envelope-front" d="m35 40 75 56 75-56v78a12 12 0 0 1-12 12H47a12 12 0 0 1-12-12Z" />
      <path class="envelope-flap" d="m35 40 75 55 75-55-75-22Z" />
      <circle class="envelope-seal" cx="110" cy="91" r="13" />
      <text x="110" y="96" text-anchor="middle" fill="#b83b58" font-size="14">♥</text>
    </svg>

    <p class="intro">Someone left you a tiny note. Go on—open it!</p>

    <div class="actions">
      <button id="open-letter" type="button" aria-expanded="false" aria-controls="letter">
        Open the letter
      </button>
    </div>

    <section class="letter" id="letter" aria-live="polite">
      <div class="letter-copy">
        <p>Dear you,</p>
        <p class="surprise">TANGINA MO</p>
        <p class="signoff">ZENDO TO GAGI ♥</p>
      </div>
    </section>

    <p class="footer">A tiny letter with a big surprise</p>
  </main>

  <script>
    const button = document.querySelector("#open-letter");
    const letter = document.querySelector("#letter");

    button.addEventListener("click", () => {
      const isOpen = letter.classList.toggle("open");
      button.setAttribute("aria-expanded", String(isOpen));
      button.textContent = isOpen ? "Close the letter" : "Open the letter";
    });
  </script>
</body>
</html>
